# Offline simulated source failures; no live credentials or egress.
name: epochguard-lab
x-native: &native
  image: ${EPOCHGUARD_LAB_IMAGE_PREFIX:-epochguard}-dev:002a
  platform: linux/amd64
x-gateway: &gateway
  <<: *native
  command: ["/app/bifrost-http", "-app-dir", "/app/verify", "-host", "0.0.0.0", "-port", "8080"]
  environment: {BIFROST_SETUP_TOKEN: epochguard-local-dev-only}
  networks: [private]
  tmpfs: ["/tmp:uid=10001,gid=10001,mode=1777"]
  depends_on:
    key-init: {condition: service_completed_successfully}
    provider: {condition: service_healthy}
    verifier: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
    interval: 2s
    timeout: 2s
    retries: 60
    start_period: 10s
x-ingress-env: &ingress-env
  EPOCHGUARD_GATEWAY_URL: http://gateway:8080
  EPOCHGUARD_ATTESTATION_SECRET_FILE: /run/receipt/receipt.hex
  EPOCHGUARD_SETUP_TOKEN: epochguard-local-dev-only
  EPOCHGUARD_INGRESS_PROFILE: 004g
x-ingress: &ingress
  <<: *native
  command: ["/app/protected-ingress"]
  networks: [edge, private]
  volumes: ["receipt:/run/receipt:ro"]
  depends_on:
    gateway: {condition: service_healthy}
services:
  lab:
    image: ${EPOCHGUARD_LAB_IMAGE_PREFIX:-epochguard}-lab:005a
    build:
      context: .
      dockerfile: dev/Dockerfile.lab
      args:
        NATIVE_IMAGE: ${EPOCHGUARD_LAB_IMAGE_PREFIX:-epochguard}-dev:002a
    platform: linux/amd64
    ports: ["127.0.0.1:${EPOCHGUARD_LAB_TEST_PORT:-8787}:8787"]
    networks: [local-entry, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      ingress: {condition: service_started}
      ingress-unsafe: {condition: service_started}
    healthcheck:
      test: ["CMD", "/app/verification-lab", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
  key-init:
    <<: *native
    user: "0:0"
    command: ["/app/protected-ingress", "-generate-fixture-secret", "/run/receipt/receipt.hex"]
    environment: {EPOCHGUARD_TEST_MODE: "1"}
    network_mode: none
    volumes: ["receipt:/run/receipt"]
  provider:
    <<: *native
    networks: [private]
    command: ["/app/provider-fixture", "-answer-mode", "claim", "-qualification-004gs"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 30
  verifier:
    image: ${EPOCHGUARD_LAB_IMAGE_PREFIX:-epochguard}-verifier:004g
    platform: linux/amd64
    networks: [private]
    command: ["python", "-m", "uvicorn", "tests_bounded_prose.simulated:fixture_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--limit-concurrency", "32"]
    environment: {EPOCHGUARD_TEST_MODE: "1"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  gateway:
    <<: *gateway
    volumes: ["receipt:/run/receipt:ro", "./dev/prose/gateway.json:/app/verify/config.json:ro"]
  gateway-control:
    <<: *gateway
    volumes: ["./dev/live/gateway-control.json:/app/verify/config.json:ro"]
  ingress:
    <<: *ingress
    environment: *ingress-env
  ingress-unsafe:
    <<: *ingress
    environment:
      <<: *ingress-env
      EPOCHGUARD_GATEWAY_URL: http://gateway-control:8080
    depends_on:
      gateway-control: {condition: service_healthy}
volumes:
  receipt:
networks:
  local-entry: {}
  edge:
    internal: true
  private:
    internal: true
