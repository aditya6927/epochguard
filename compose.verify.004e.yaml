# Explicit live opt-in. No host ports. Only verifier has egress capability.
name: epochguard-004e
x-native: &native
  image: epochguard-dev:002a
  platform: linux/amd64
x-gateway: &gateway
  <<: *native
  command: ["/app/bifrost-http", "-app-dir", "/app/verify", "-host", "0.0.0.0", "-port", "8080"]
  environment: {BIFROST_SETUP_TOKEN: epochguard-local-dev-only}
  networks: [private]
  tmpfs: ["/tmp:uid=10001,gid=10001,mode=1777"]
  depends_on:
    key-init: {condition: service_completed_successfully}
    provider: {condition: service_healthy}
    verifier: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
    interval: 2s
    timeout: 2s
    retries: 60
    start_period: 10s
x-ingress-env: &ingress-env
  EPOCHGUARD_GATEWAY_URL: http://gateway:8080
  EPOCHGUARD_ATTESTATION_SECRET_FILE: /run/receipt/receipt.hex
  EPOCHGUARD_SETUP_TOKEN: epochguard-local-dev-only
  EPOCHGUARD_INGRESS_PROFILE: 004e-live
x-ingress: &ingress
  <<: *native
  command: ["/app/protected-ingress"]
  networks: [client, private]
  volumes: ["receipt:/run/receipt:ro"]
  depends_on:
    gateway: {condition: service_healthy}
services:
  key-init:
    <<: *native
    user: "0:0"
    command: ["/app/protected-ingress", "-generate-fixture-secret", "/run/receipt/receipt.hex"]
    environment: {EPOCHGUARD_TEST_MODE: "1"}
    network_mode: none
    volumes: ["receipt:/run/receipt"]
  provider:
    <<: *native
    networks: [private]
    command: ["/app/provider-fixture", "-answer-mode", "claim", "-qualification-004c"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 30
  verifier:
    image: epochguard-verifier:004e
    platform: linux/amd64
    networks: [private, evidence-egress]
    environment:
      EPOCHGUARD_RUN_LIVE_004E: ${EPOCHGUARD_RUN_LIVE_004E:?Explicit live opt-in required}
      EPOCHGUARD_004E_PROFILE: live
      EPOCHGUARD_TAVILY_SECRET_FILE: /run/secrets/tavily_key
    secrets: [tavily_key]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  gateway:
    <<: *gateway
    networks:
      private: {ipv4_address: 10.77.24.10}
    volumes: ["receipt:/run/receipt:ro", "./dev/live/gateway.json:/app/verify/config.json:ro"]
  gateway-control:
    <<: *gateway
    volumes: ["./dev/live/gateway-control.json:/app/verify/config.json:ro"]
  ingress:
    <<: *ingress
    environment: *ingress-env
  ingress-unsafe:
    <<: *ingress
    environment:
      <<: *ingress-env
      EPOCHGUARD_GATEWAY_URL: http://gateway-control:8080
    depends_on:
      gateway-control: {condition: service_healthy}
  qualification-client:
    profiles: [qualification]
    image: epochguard-verifier:004e
    platform: linux/amd64
    networks: [client]
    environment: {EPOCHGUARD_RUN_LIVE_004E: "1"}
    command: ["python", "-m", "tests_live.runner", "client"]
  qualification-operator:
    profiles: [qualification]
    image: epochguard-verifier:004e
    platform: linux/amd64
    networks: [private]
    environment: {EPOCHGUARD_RUN_LIVE_004E: "1"}
    command: ["python", "-m", "tests_live.runner", "preflight"]
secrets:
  tavily_key:
    file: ${EPOCHGUARD_TAVILY_SECRET_HOST_FILE:?Set a runtime secret file path}
volumes:
  receipt:
networks:
  client:
    internal: true
  private:
    internal: true
    ipam:
      config: [{subnet: 10.77.24.0/24, ip_range: 10.77.24.128/25}]
  evidence-egress: {}
