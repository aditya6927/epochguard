# Explicit live override: enables egress and uses the real HTTPS Tavily API.
# Only start gateway-supported. Never run offline acceptance expectations here.
name: epochguard-003a-live
services:
  verifier-supported:
    environment:
      EPOCHGUARD_TIMEOUT_PROFILE: live
      EPOCHGUARD_TEST_MODE: ""
      EPOCHGUARD_TEST_TAVILY_ENDPOINT: ""
      TAVILY_API_KEY: ${TAVILY_API_KEY:?Set TAVILY_API_KEY for the opt-in live deployment}
  verification-tests:
    # Live qualification is explicitly selected; never run synthetic release
    # expectations against the live verifier. This runner receives no API key.
    command: ["/app/verification.test", "-test.v", "-test.run=^TestLiveGatewayQualification$", "-test.timeout=150s"]
    environment:
      EPOCHGUARD_GATEWAY_CLIENT_TIMEOUT_MS: "30000"
      EPOCHGUARD_RUN_LIVE_TAVILY: ${EPOCHGUARD_RUN_LIVE_TAVILY:-0}
  gateway-supported:
    volumes: ["./dev/bifrost/verification/live.json:/app/verify/config.json:ro"]
    ports: ["127.0.0.1:8081:8080"]
networks:
  default:
    internal: false
