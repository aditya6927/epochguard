name: epochguard-005f
x-native: &native
  image: ${EPOCHGUARD_005F_NATIVE_IMAGE:?immutable native image required}
  platform: linux/amd64
x-gateway: &gateway
  <<: *native
  command: ["/app/bifrost-http", "-app-dir", "/app/verify", "-host", "0.0.0.0", "-port", "8080"]
  environment: {BIFROST_SETUP_TOKEN: epochguard-local-dev-only}
  networks: [private]
  tmpfs: ["/tmp:uid=10001,gid=10001,mode=1777"]
  depends_on:
    key-init: {condition: service_completed_successfully}
    provider: {condition: service_healthy}
    verifier: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
    interval: 2s
    timeout: 2s
    retries: 60
x-ingress: &ingress
  <<: *native
  command: ["/app/protected-ingress"]
  networks: [client, private]
  volumes: ["receipt:/run/receipt:ro"]
  depends_on:
    gateway: {condition: service_healthy}
    gateway-control: {condition: service_healthy}
services:
  key-init:
    <<: *native
    user: "0:0"
    command: ["/app/protected-ingress", "-generate-fixture-secret", "/run/receipt/receipt.hex"]
    environment: {EPOCHGUARD_TEST_MODE: "1"}
    network_mode: none
    volumes: ["receipt:/run/receipt"]
  provider:
    <<: *native
    command: ["/app/provider-fixture", "-answer-mode", "claim"]
    networks: [private]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 30
  verifier:
    image: ${EPOCHGUARD_005F_BENCH_IMAGE:?immutable benchmark image required}
    platform: linux/amd64
    command: ["python", "-m", "uvicorn", "tests_bounded_prose.simulated:fixture_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--limit-concurrency", "32"]
    environment: {EPOCHGUARD_TEST_MODE: "1"}
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  gateway:
    <<: *gateway
    volumes: ["receipt:/run/receipt:ro", "${EPOCHGUARD_005F_RUN_DIR:?run directory required}/gateway.json:/app/verify/config.json:ro"]
  gateway-control:
    <<: *gateway
    volumes: ["${EPOCHGUARD_005F_RUN_DIR:?run directory required}/gateway-control.json:/app/verify/config.json:ro"]
  ingress:
    <<: *ingress
    environment:
      EPOCHGUARD_GATEWAY_URL: http://gateway:8080
      EPOCHGUARD_ATTESTATION_SECRET_FILE: /run/receipt/receipt.hex
      EPOCHGUARD_SETUP_TOKEN: epochguard-local-dev-only
      EPOCHGUARD_INGRESS_PROFILE: 004g
  ingress-unsafe:
    <<: *ingress
    environment:
      EPOCHGUARD_GATEWAY_URL: http://gateway-control:8080
      EPOCHGUARD_ATTESTATION_SECRET_FILE: /run/receipt/receipt.hex
      EPOCHGUARD_SETUP_TOKEN: epochguard-local-dev-only
      EPOCHGUARD_INGRESS_PROFILE: 004g
  benchmark:
    profiles: [measurement]
    image: ${EPOCHGUARD_005F_BENCH_IMAGE:?immutable benchmark image required}
    platform: linux/amd64
    # Trusted measurement client reads private counters and calls the baseline.
    networks: [client, private]
    environment: {EPOCHGUARD_TEST_MODE: "1"}
    command: ["python", "-m", "gatecompare.benchmark"]
volumes:
  receipt:
networks:
  client: {internal: true}
  private: {internal: true}
